# Mirrors apps/web/vite.config.ts's dev proxy list — same reason: the session
# cookie is Secure/SameSite=strict, so the API must be reachable same-origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(auth|health|rules|sources|recipients|matches|metrics|notifications|events|listener|demo|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /events is SSE: buffering would hold the stream hostage until nginx's
        # buffer fills, defeating live delivery, and a short read timeout would
        # cut an idle-but-open connection.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
