# Contributor stack: hot-reload API with the source bind-mounted. Not for running the app;
# self-hosting uses docker-compose.yml (see README). Usage: docker compose -f docker-compose.dev.yml up
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./apps/api:/app/apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
