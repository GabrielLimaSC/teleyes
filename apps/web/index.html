<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- S12-02: theme before the first paint (no flash). Mirrors src/theme/theme.ts:
         preference system|light|dark (default system) from localStorage, resolved
         through prefers-color-scheme, put on <html data-theme> together with the
         browser chrome color. Every storage/matchMedia access is guarded: the page
         works without them. The two colors are the light/dark
         --browser-chrome-color tokens (styles/materials.css); a test keeps them in step. -->
    <script>
      (function () {
        var preference = 'system'
        try {
          var stored = window.localStorage.getItem('teleyes.theme')
          if (stored === 'light' || stored === 'dark') preference = stored
        } catch (e) {}
        var systemDark = false
        try {
          systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) {}
        var resolved = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference
        var root = document.documentElement
        root.setAttribute('data-theme', resolved)
        root.setAttribute('data-theme-preference', preference)
        var meta = document.createElement('meta')
        meta.name = 'theme-color'
        meta.content = resolved === 'dark' ? '#0f1116' : '#f5f5f5'
        document.head.appendChild(meta)
      })()
    </script>
    <!-- S9-01: Inter, o corpo de texto do design system Dub (--font-body em
         styles/tokens.css). Satoshi/Geist Mono ficam sem webfont carregado
         por ora — nada em território da S9-01 usa texto display/mono, ver
         nota em tokens.css.
         S11-01: peso 700 adicionado — o concept.html do redesenho unificado
         usa font-weight:700 em títulos/valores por toda parte (65
         ocorrências), sem isso o navegador teria que sintetizar o negrito
         a partir do 600 carregado, pior que o peso real. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>teleyes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
