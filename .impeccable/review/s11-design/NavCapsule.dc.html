<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;justify-content:center;padding:18px 12px 10px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <div style="position:relative;width:720px;height:68px">
    <div style="position:absolute;inset:2px 0;border-radius:999px;background:linear-gradient(165deg,rgba(255,255,255,.78) 0%,rgba(237,239,243,.44) 42%,rgba(211,214,221,.56) 100%),rgba(232,234,239,.42);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.84);box-shadow:inset 0 2px 2px rgba(255,255,255,.92),inset 0 -2px 3px rgba(58,61,70,.18),0 0 0 1px rgba(70,74,83,.19),0 18px 32px rgba(23,23,23,.13),0 4px 10px rgba(23,23,23,.09)"></div>
    <div style="position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);align-items:center;height:100%;padding:0 18px;box-sizing:border-box">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:2px">
        <sc-for list="{{ left }}" as="t" hint-placeholder-count="3"><a href="#1a" style="{{ t.style }}">{{ t.label }}</a></sc-for>
      </div>
      <div></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:2px">
        <sc-for list="{{ right }}" as="t" hint-placeholder-count="3"><a href="#1a" style="{{ t.style }}">{{ t.label }}</a></sc-for>
      </div>
    </div>
    <div style="position:absolute;z-index:4;top:50%;left:50%;width:60px;height:60px;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:linear-gradient(165deg,rgba(255,255,255,.78) 0%,rgba(237,239,243,.44) 42%,rgba(211,214,221,.56) 100%),rgba(232,234,239,.42);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.84);box-shadow:inset 0 2px 2px rgba(255,255,255,.92),inset 0 -2px 3px rgba(58,61,70,.18),0 12px 28px rgba(8,6,13,.28),0 0 22px rgba(255,255,255,.32)">
      <div style="position:absolute;inset:7px;border-radius:50%;background:repeating-linear-gradient(135deg,#d8dce4 0 3px,#eef0f4 3px 6px);display:flex;align-items:center;justify-content:center">
        <span style="font-family:ui-monospace,Menlo,monospace;font-size:8px;font-weight:600;color:#525866;letter-spacing:.02em">mascote</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:110},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Login&quot;,&quot;Feed&quot;,&quot;Regras&quot;,&quot;Fontes&quot;,&quot;Histórico&quot;,&quot;Saúde&quot;],&quot;default&quot;:&quot;Feed&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  style(label) {
    const base = "display:inline-flex;min-height:40px;align-items:center;justify-content:center;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:550;line-height:1;text-decoration:none;white-space:nowrap;";
    return label === (this.props.active ?? "Feed")
      ? base + "color:#ffffff;background:#171717;box-shadow:0 4px 10px rgba(23,23,23,.2),inset 0 1px 0 rgba(255,255,255,.24)"
      : base + "color:#4b4b52";
  }
  renderVals() {
    const mk = labels => labels.map(label => ({ label, style: this.style(label) }));
    return { left: mk(["Login", "Feed", "Regras"]), right: mk(["Fontes", "Histórico", "Saúde"]) };
  }
}
</script>
</body>
</html>
