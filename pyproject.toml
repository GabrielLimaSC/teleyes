[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teleyes"
version = "0.1.0"
description = "Monitor pessoal de promoções do Telegram"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app", "apps/api/models", "packages"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "models", "packages"]

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/api"
files = ["apps/api", "packages"]
exclude = ["apps/api/alembic/versions"]
explicit_package_bases = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages"]
pythonpath = ["apps/api", "."]
asyncio_mode = "auto"
