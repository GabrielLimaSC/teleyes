name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Cancel superseded runs of the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy .
      - name: Tests (pytest)
        run: pytest -q

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (shellcheck is preinstalled on ubuntu-latest)
        run: shellcheck install.sh scripts/test_install.sh docker/*.sh

  compose:
    name: Compose files (config)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate the self-host and demo compose files
        # No .env exists in CI, so no secret is ever interpolated or printed.
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.demo.yml config --quiet

  web:
    name: Web (tsc, oxlint, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check (tsc)
        run: npx tsc -b
      - name: Lint (oxlint)
        run: npm run lint
      - name: Tests (vitest)
        run: npm run test
