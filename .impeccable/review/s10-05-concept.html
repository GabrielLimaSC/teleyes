  <script>
    const screen = new URL(location.href).searchParams.get('screen') || 'login';
    const current = ['login','feed','historico','regras','saude'].includes(screen) ? screen : 'login';
    document.getElementById('screen').append(document.getElementById(current).content.cloneNode(true));
    if (current === 'historico') {
      document.querySelector('.history-results').append(document.getElementById('feed').content.querySelector('.match-list').cloneNode(true));
    }
    document.querySelector('[data-tab="'+current+'"]').classList.add('active');
    document.getElementById('mobile-current').textContent = ({login:'Login',feed:'Feed',historico:'Histórico',regras:'Regras',saude:'Saúde'})[current];
  </script>
</body>
</html>
