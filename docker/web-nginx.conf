# Mirrors apps/web/vite.config.ts's dev proxy list — same reason: the session
# cookie is Secure/SameSite=strict, so the API must be reachable same-origin.
server {
    listen 8080;
    server_name _;
    # S23-01: do not advertise the nginx version; a login form has no use for a big body.
    server_tokens off;
    client_max_body_size 256k;
    root /usr/share/nginx/html;
    index index.html;

    # S23-01: security headers, on every response (static files and the proxied API).
    # Keep this block free of per-location `add_header`: a location that declares one
    # silently drops all of these. apps/web/src/securityHeaders.test.ts reads this file.
    #
    # CSP, in terms of what the app really loads:
    #  - script-src: the bundle ('self') and ONE inline script, the pre-paint theme
    #    snippet in apps/web/index.html, allowed by its hash. Editing that snippet changes
    #    the hash; securityHeaders.test.ts tells you the new value.
    #  - style-src 'unsafe-inline': React renders `style={{...}}` attributes. Styles can
    #    not run code, so this is the one relaxation; fonts.googleapis.com is Inter's CSS.
    #  - font-src: fonts.gstatic.com serves Inter's files.
    #  - img-src data: for the inline SVG/data URIs used by the UI.
    #  - connect-src 'self': fetch() and the /events EventSource are same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-mBlFH3tH4R/w4jY8gCdOfBICCAoL3B8mPm70flsOPbs='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location ~ ^/(auth|health|rules|sources|recipients|matches|metrics|notifications|events|listener|demo|settings|products|snoozes|purchases|savings|digest|setup|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /events is SSE: buffering would hold the stream hostage until nginx's
        # buffer fills, defeating live delivery, and a short read timeout would
        # cut an idle-but-open connection.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
